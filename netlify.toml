[build]
  command = "npm run build:prod"
  publish = "dist/portfolioiq-angular"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # GitHub token for AI features (set in Netlify Dashboard → Environment Variables)
  # Users will automatically get AI features without manual configuration

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200
  force = true

[[redirects]]
  from = "/api/github-models/*"
  to = "https://models.inference.ai.azure.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
